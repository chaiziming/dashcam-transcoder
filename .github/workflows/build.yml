name: 构建安装包

# 触发时机：
#   推 tag（v1.0.0 这样）→ 构建并发布到 Releases
#   手动触发 / 推 main    → 只构建，不发布（用于验证流水线是否正常）
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # 必须是 Windows —— 我们打包的是 .exe 和 Windows 安装程序
    runs-on: windows-latest

    # 必须显式声明写权限。GitHub 默认的 GITHUB_TOKEN 是只读的，
    # 不声明这行的话最后「发布到 Releases」会报
    # "Resource not accessible by integration"（前 9 步全过就挂这一步）。
    permissions:
      contents: write

    steps:
      # ---------- 1. 取出代码 ----------
      - name: 检出代码
        uses: actions/checkout@v5

      # ---------- 2. 装 Python 依赖 ----------
      - name: 安装 Python 依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller tkinterdnd2 pytest

      # ---------- 3. 装 Inno Setup（编译安装包用）----------
      # 不用 choco：首次运行要先下载软件源，受网络/代理/权限影响，
      # 而且装完 ISCC 的实际路径随版本变化，容易在这一步就挂掉（实测踩过）。
      # 改成直接下官方安装器静默安装，路径固定可控。
      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          Write-Host "下载 Inno Setup 6.7.3..."
          Invoke-WebRequest -Uri $url -OutFile $installer

          Write-Host "静默安装..."
          $p = Start-Process -FilePath $installer `
                 -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" `
                 -Wait -PassThru
          Write-Host "安装器退出码: $($p.ExitCode)"

          # 官方安装器默认装到 Program Files (x86)，但为防路径变化多试几个
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "预定路径都没找到，全盘搜索一次..."
            $found = Get-ChildItem -Path "C:\" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if ($found) { $iscc = $found.FullName }
          }
          if (-not $iscc) {
            Write-Error "找不到 ISCC.exe。已尝试: $($candidates -join ', ')"
            exit 1
          }

          # 传给后续步骤使用
          "ISCC_PATH=$iscc" >> $env:GITHUB_ENV
          Write-Host "ISCC 就绪: $iscc"

      # ---------- 4. 下载 ffmpeg ----------
      # 不能把 200MB+ 的二进制提交进仓库，必须构建时现下。
      # 用 BtbN 的构建而不是 gyan.dev：实测 Invoke-WebRequest 请求
      # gyan 的 latest 重定向会返回 404（curl 能过，PowerShell 不行）。
      - name: 下载 ffmpeg
        shell: pwsh
        run: |
          # 镜像依次尝试，任一成功即可。
          # 实测（2026-10）：
          #   github.com/GyanD/... 的 latest 重定向 404，不可用
          #   www.gyan.dev 直连          可用，essentials 约 110MB
          #   BtbN                       可用，full 约 200MB（兜底）
          # essentials 已含本项目所需：libx264 / aac / drawbox / boxblur / overlay
          $urls = @(
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          )

          # 关掉进度条，否则大文件会在日志里刷出几万行看不清错误
          $ProgressPreference = 'SilentlyContinue'
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $ok = $false
          foreach ($u in $urls) {
            Write-Host "---- 尝试: $u"
            try {
              # 显式设 UA：部分 CDN 对默认 PowerShell UA 会返回 403
              Invoke-WebRequest -Uri $u -OutFile $zip -TimeoutSec 600 `
                                -UserAgent "Mozilla/5.0"
              $size = (Get-Item $zip).Length
              Write-Host "下载成功：$([math]::Round($size/1MB,1)) MB"
              if ($size -gt 1MB) { $ok = $true; break }
              Write-Warning "文件太小（$size 字节），换下一个源"
              Remove-Item $zip -ErrorAction SilentlyContinue
            } catch {
              # 把真实异常打出来，否则只看到 exit 1 无法定位
              Write-Warning "失败：$($_.Exception.Message)"
              if ($_.Exception.Response) {
                Write-Warning "  HTTP 状态：$([int]$_.Exception.Response.StatusCode) $($_.Exception.Response.StatusDescription)"
              }
            }
          }
          if (-not $ok) { Write-Error "所有 ffmpeg 下载源都失败了"; exit 1 }

          $extractDir = Join-Path $env:RUNNER_TEMP "ffmpeg-extracted"
          Expand-Archive -Path $zip -DestinationPath $extractDir -Force

          # 解压目录名带版本号，需定位
          $bin = Get-ChildItem $extractDir -Recurse -Filter "ffmpeg.exe" -File |
                 Select-Object -First 1
          if (-not $bin) {
            Write-Error "压缩包里没有 ffmpeg.exe。解压后目录："
            Get-ChildItem $extractDir -Recurse -Depth 2 |
              Select-Object -First 20 -ExpandProperty FullName
            exit 1
          }
          $binDir = $bin.Directory.FullName
          Write-Host "ffmpeg 目录: $binDir"

          New-Item -ItemType Directory -Force -Path "build_assets\ffmpeg" | Out-Null
          Copy-Item "$binDir\ffmpeg.exe"  "build_assets\ffmpeg\" -Force
          Copy-Item "$binDir\ffprobe.exe" "build_assets\ffmpeg\" -Force

          # 校验 ffmpeg 真的能执行。
          # 注意：绝不能写成 `& xxx -version | Select-Object -First 1` ——
          # Select-Object -First 会提前掐断管道，PowerShell 认为上游进程被异常
          # 终止，$LASTEXITCODE 会变成 -1，于是一个完全正常的 ffmpeg 被误判为「无法执行」。
          # 正确做法：先把输出全部收进变量，再从变量里取首行。
          $ver = & ".\build_assets\ffmpeg\ffmpeg.exe" -version 2>&1
          $ffCode = $LASTEXITCODE
          Write-Host ($ver | Select-Object -First 1)
          if ($ffCode -ne 0) {
            Write-Error "ffmpeg 无法执行 (exit=$ffCode)"
            Write-Host "完整输出:"
            $ver | Select-Object -First 10 | ForEach-Object { Write-Host "  $_" }
            exit 1
          }

          $pver = & ".\build_assets\ffmpeg\ffprobe.exe" -version 2>&1
          $pfCode = $LASTEXITCODE
          Write-Host ($pver | Select-Object -First 1)
          if ($pfCode -ne 0) {
            Write-Error "ffprobe 无法执行 (exit=$pfCode)"
            exit 1
          }

          # 打印构建配置，便于日后核对编译能力（libx264/aac 等）
          $conf = & ".\build_assets\ffmpeg\ffmpeg.exe" -hide_banner -buildconf 2>&1
          Write-Host "构建配置: $($conf -join '')"

          # 关键：把下载的 ffmpeg 加进 PATH。
          # 后续步骤（跑测试、打包、编译）调 ffmpeg 时靠 PATH 查找，
          # GitHub runner 上本来没有系统 ffmpeg，不加这一步测试会因找不到而失败。
          #
          # 两件事都要做，缺一不可：
          #   1) 改 $env:PATH      → 只对当前步骤生效（下面的验证要用）
          #   2) 写 $env:GITHUB_PATH → 对后续所有步骤生效
          # 只写 GITHUB_PATH 的话，当前步骤的 PATH 不会变，
          # 下面的 Get-Command 会误判为「找不到」而直接失败。
          $ffDir = (Resolve-Path ".\build_assets\ffmpeg").Path
          $env:PATH = "$ffDir;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $ffDir
          Write-Host "已加入 PATH（当前步骤 + 后续步骤）: $ffDir"

          # 验证：直接用完整路径调，不依赖 PATH（最可靠）
          $probe = & "$ffDir\ffmpeg.exe" -version 2>&1
          $probeCode = $LASTEXITCODE
          Write-Host ($probe | Select-Object -First 1)
          if ($probeCode -ne 0) {
            Write-Error "ffmpeg 无法执行 (exit=$probeCode)"
            exit 1
          }
          Write-Host "验证通过"

      # ---------- 5. 生成图标 ----------
      # 图标是锦上添花，失败不该让整个流水线挂掉 —— 退回无图标版本。
      - name: 生成应用图标
        shell: pwsh
        run: |
          # 让 Python 输出与仓库里的中文注释一致，避免编码问题
          $env:PYTHONIOENCODING = "utf-8"
          New-Item -ItemType Directory -Force -Path "build_assets" | Out-Null

          Write-Host "Python: $(python --version 2>&1)"
          python installer\make_icon.py 2>&1 | ForEach-Object { Write-Host $_ }
          $code = $LASTEXITCODE
          Write-Host "make_icon 退出码 = $code"

          $ico = "build_assets\app.ico"
          if ($code -eq 0 -and (Test-Path $ico)) {
            Write-Host "图标就绪: $((Get-Item $ico).Length) 字节"
          } else {
            # 打印真实错误，并把 build_assets 列出来帮助定位
            Write-Warning "图标生成失败（退出码 $code），将以无图标方式继续构建"
            if (Test-Path "build_assets") {
              Get-ChildItem "build_assets" -Recurse |
                ForEach-Object { Write-Warning "  $($_.FullName)" }
            } else {
              Write-Warning "  build_assets 目录不存在"
            }
            Remove-Item $ico -ErrorAction SilentlyContinue
          }

      # ---------- 6. 跑测试 ----------
      # 没有真实视频样本时，相关用例会自行跳过（见 tests/sample_helper.py）
      - name: 运行测试
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"

          # 逐个跑并完整打印输出与真实退出码。
          # 测试是发布前的质量闸门，失败必须中断 —— 但必须让人看得懂为什么挂。
          $testList = @(
            "tests.test_core",
            "tests.test_gui_smoke",
            "tests.test_idle_state",
            "tests.test_player_bar",
            "tests.test_merge_ui",
            "tests.test_merge",
            "tests.test_speed",
            "tests.test_time_input",
            "tests.check_workflow"
          )
          $failed = @()

          foreach ($t in $testList) {
            Write-Host "=========================================="
            Write-Host ">>> 运行 $t"
            Write-Host "=========================================="

            $out = & python -m $t 2>&1
            $code = $LASTEXITCODE
            $out | ForEach-Object { Write-Host $_ }

            Write-Host ">>> $t 退出码 = $code"
            if ($code -ne 0) { $failed += $t }
            Write-Host ""
          }

          if ($failed.Count -gt 0) {
            Write-Error "以下测试失败: $($failed -join ', ')"
            Write-Host ""
            Write-Host "排查提示："
            Write-Host "  - 找不到 ffmpeg：步骤 4 下载的 ffmpeg 在 build_assets\ffmpeg，需加入 PATH"
            Write-Host "  - tkinter 缺失：CI 的 Python 可能没带 tkinter，GUI 测试会全挂"
            Write-Host "  - 权限/显示：CI 无桌面会话，GUI 测试需无头模式"
            exit 1
          }
          Write-Host "全部测试通过"

      # ---------- 7. 打包 exe ----------
      - name: 打包 exe
        shell: pwsh
        run: |
          python -m PyInstaller build_exe.spec --clean --noconfirm
          if ($LASTEXITCODE -ne 0) { Write-Error "PyInstaller 打包失败"; exit 1 }
          New-Item -ItemType Directory -Force -Path "build_assets" | Out-Null
          Copy-Item "dist\记录仪视频转码工具.exe" "build_assets\" -Force
          Get-ChildItem build_assets

      # ---------- 8. 编译安装包 ----------
      - name: 编译安装包
        shell: pwsh
        run: |
          # 用 /D 传绝对路径 —— CI 的工作目录和本地不同
          $assets = (Resolve-Path "build_assets").Path
          $out    = Join-Path $env:GITHUB_WORKSPACE "dist_installer"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $readme = (Resolve-Path "docs_使用说明.md").Path
          $iscc   = $env:ISCC_PATH
          if (-not (Test-Path $iscc)) { Write-Error "ISCC_PATH 无效: $iscc"; exit 1 }

          # 版本号从 git tag 取（v1.0.8 -> 1.0.8），避免安装包文件名和 tag 对不上。
          # 不是 tag 触发的构建（推 main / 手动触发）就用 commit 短哈希。
          $ref = $env:GITHUB_REF
          $ver = "0.0.0"
          if ($ref -match '^refs/tags/v(.+)$') {
            $ver = $Matches[1]
          } elseif ($env:GITHUB_SHA) {
            $ver = $env:GITHUB_SHA.Substring(0, 7)
          }
          Write-Host "构建版本: $ver （来源: $ref）"

          & $iscc `
            "/DAppVersion=$ver" `
            "/DBuildAssets=$assets" `
            "/DOutputDir=$out" `
            "/DReadmeFile=$readme" `
            "installer\dashcam_transcoder.iss"

          # 注意：Inno 编译失败时 ExitCode 可能是 2 而不是 1，非 0 都当失败
          if ($LASTEXITCODE -ne 0) {
            Write-Error "安装包编译失败 (exit=$LASTEXITCODE)"
            exit 1
          }
          $setup = Get-ChildItem $out -Filter "*.exe"
          if (-not $setup) { Write-Error "编译成功但没产出安装包"; exit 1 }
          $setup | Select-Object Name, @{n='MB'; e={[math]::Round($_.Length/1MB,1)}}

          # 文件名版本号必须与构建版本一致，不一致要立刻发现
          if ($setup.Name -notmatch [regex]::Escape($ver)) {
            Write-Warning "警告：安装包名 $($setup.Name) 与构建版本 $ver 不一致"
          }

      # ---------- 9. 上传产物 ----------
      - name: 上传安装包（普通 push 时也存一份，方便下载测试）
        uses: actions/upload-artifact@v4
        with:
          name: dashcam-transcoder-setup
          path: dist_installer/*.exe
          if-no-files-found: error
          retention-days: 30

      # ---------- 10. 发到 Releases（仅 tag 触发时） ----------
      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_installer/*.exe
          # 不用 generate_release_notes：那个 API 在新仓库/低权限场景下
          # 会报 "Resource not accessible by integration"。自己写说明更可控。
          name: 记录仪视频转码工具 ${{ github.ref_name }}
          body: |
            ## 下载

            **Windows 用户**：下载下面的 `dashcam-transcoder-*-setup.exe`，双击安装即可。

            - 向导式安装界面，可自选安装目录
            - 自动创建开始菜单和桌面快捷方式
            - **内置 ffmpeg，无需另行安装**
            - 可从「控制面板 → 应用和功能」正常卸载

            **体积说明**：约 100 MB（已内置 essentials 版 ffmpeg）。

            ## 使用

            1. 双击安装
            2. 把行车记录仪的 `.h264` 文件拖进窗口
            3. 等待生成预览，播放到要遮挡的位置后在画面上**拖动鼠标框选**
            4. 点「开始处理」

            ## 安全提醒

            自动遮挡只挡住你自己车的 VIN。画面里**其他车辆的车牌**是可识别信息，
            提交举报材料前请务必自行框选遮挡。

            ---
            由 GitHub Actions 自动构建发布。